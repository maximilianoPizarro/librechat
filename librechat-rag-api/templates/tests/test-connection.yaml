apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "rag.fullname" . }}-test-connection"
  labels:
    {{- include "rag.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: wget
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      command: ['curl']
      args: ['-sSf', 'http://{{ include "rag.fullname" . }}:{{ .Values.service.port }}/health']
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
  restartPolicy: Never
