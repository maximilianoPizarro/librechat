# values.yaml — LibreChat Helm Chart
#
# Ready to deploy on OpenShift Developer Sandbox:
#   helm install librechat . -n <namespace>
#
# Developer Sandbox restrictions (applied by default):
#   - Restricted SCC (no fsGroup, random UID)
#   - Cannot create SCC Roles → sccRoleDisabled: true
#   - enableServiceLinks: false to avoid env-var conflicts
#   - StorageClass: gp3-csi
#
# AI models are served via LiteLLM proxy pointing at the sandbox
# shared vLLM inference services. Ollama and RamaLama are disabled
# by default to save resources.

global:
  librechat:
    existingSecretApiKey: OPENAI_API_KEY
    existingSecretName: librechat-librechat-secretenv

image:
  pullPolicy: IfNotPresent
  registry: quay.io
  repository: maximilianopizarro/librechat
  tag: 'v0.8.7'

imagePullSecrets: []
enableServiceLinks: false

# --- Security (sandbox-safe defaults) ---

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true

# --- Networking ---

route:
  enabled: true
  host: ''
  sccRoleDisabled: true

ingress:
  annotations: {}
  className: ''
  enabled: false
  hosts:
    - host: librechat.openshiftapps.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

service:
  annotations: {}
  port: 3080
  type: ClusterIP

# --- LibreChat application config ---

librechat:
  configEnv:
    SEARCH: 'true'
    MEILI_NO_ANALYTICS: 'true'
    MEILI_MASTER_KEY: librechat
    OPENAI_API_KEY: IiI=
    NODE_TLS_REJECT_UNAUTHORIZED: '0'
    CREDS_IV: 118a16ffe26a8712d0adb5b3cf8229ca
    CREDS_KEY: 99f12ba0ea72257aa78df8e99c9be801716a7e16fe77e7510a914112528aa05c
    DEBUG_PLUGINS: 'true'
    JWT_REFRESH_SECRET: 8a447c316c171f5df8e304c085187b6d10e4eeef5174137d4ad4d2cdd956f5e7
    JWT_SECRET: 83096493d70e22561f84191c24f459d72e9b41f4c8657fe43aae8cb9b0fe1fa4
    ALLOW_EMAIL_LOGIN: 'true'
    ALLOW_REGISTRATION: 'true'
    ALLOW_SOCIAL_LOGIN: 'false'
    DOMAIN_SERVER: 'http://0.0.0.0:3080'
    # Uncomment for OpenID Connect / social login:
    # ALLOW_SOCIAL_LOGIN: 'true'
    # OPENID_CALLBACK_URL: /oauth/openid/callback
    # OPENID_LOGIN_ENABLED: 'true'
    # OPENID_SESSION_SECRET: sessionsecret
    # OPENID_ISSUER: 'https://auth.redhat.com/realms/librechat'
    # OPENID_USE_END_SESSION_ENDPOINT: 'true'
    # OPENID_CLIENT_ID: client-id
    # OPENID_CLIENT_SECRET: client-secret
    # SOCIAL_LOGIN_ENABLED: 'true'
    # OPENID_SCOPE: openid profile email
    # OPENID_REQUIRED_ROLE_TOKEN_KIND: access
    # OPENID_REQUIRED_ROLE_PARAMETER_PATH: realm_access.roles

  configYamlContent: |
    version: 1.3.8
    cache: true
    fileConfig:
      endpoints:
        default:
          totalSizeLimit: 20
      serverFileSizeLimit: 100
      avatarSizeLimit: 2
    rateLimits:
      fileUploads:
        ipMax: 100
        ipWindowInMinutes: 60
        userMax: 50
        userWindowInMinutes: 60
    summarization:
      enabled: true
    mcpSettings:
      allowedDomains: []
    endpoints:
      custom:
        # IBM Granite 3.1 8B via LiteLLM proxy
        - name: "IBM Granite"
          apiKey: "sk-litellm-1234"
          baseURL: "http://librechat-litellm:4000/v1"
          models:
            default: ["granite-3.1-8b"]
            fetch: true
          titleConvo: true
          titleModel: "granite-3.1-8b"
          summarize: false
          summaryModel: "granite-3.1-8b"
        # Qwen 3 8B via LiteLLM proxy
        - name: "Qwen"
          apiKey: "sk-litellm-1234"
          baseURL: "http://librechat-litellm:4000/v1"
          models:
            default: ["qwen3-8b"]
            fetch: true
          titleConvo: true
          titleModel: "qwen3-8b"
          summarize: false
          summaryModel: "qwen3-8b"
        # NVIDIA Nemotron Nano 9B v2 via LiteLLM proxy
        - name: "Nemotron"
          apiKey: "sk-litellm-1234"
          baseURL: "http://librechat-litellm:4000/v1"
          models:
            default: ["nemotron-nano-9b"]
            fetch: true
          titleConvo: true
          titleModel: "nemotron-nano-9b"
          summarize: false
          summaryModel: "nemotron-nano-9b"
        # Uncomment to add Ollama (requires ollama.enabled: true):
        # - name: "Ollama"
        #   apiKey: "${OPENAI_API_KEY}"
        #   baseURL: "http://librechat-ollama:11434/v1"
        #   models:
        #     default: ["llama3.2"]
        #     fetch: true
        #   titleConvo: true
        #   titleModel: "llama3.2"
        #   summarize: false
        #   summaryModel: "llama3.2"
        # Uncomment to add RamaLama Granite CPU (requires ramalama.enabled: true):
        # - name: "RamaLama Granite"
        #   apiKey: "not-needed"
        #   baseURL: "http://librechat-ramalama:8080/v1"
        #   models:
        #     default: ["granite-3.1-1b"]
        #     fetch: true
        #   titleConvo: true
        #   titleModel: "granite-3.1-1b"
        #   summarize: false
        #   summaryModel: "granite-3.1-1b"

  existingConfigYaml: ''
  existingSecretName: librechat-librechat-secretenv
  serviceAccountName: librechat-sa
  imageVolume:
    enabled: true
    accessModes: ReadWriteOnce
    size: 2Gi
    storageClassName: gp3-csi

# --- Probes ---

startupProbe:
  httpGet:
    path: /livez
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 36

livenessProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 0
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

# --- Resources ---

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

# --- Extra volumes (writable dirs required by LibreChat) ---

volumeMounts:
  - name: librechat-data-volume
    mountPath: /app/data
  - name: librechat-uploads-volume
    mountPath: /app/uploads
  - name: librechat-logs-volume
    mountPath: /app/logs
  - name: librechat-api-logs-volume
    mountPath: /app/api/logs

volumes:
  - name: librechat-uploads-volume
    emptyDir: {}
  - name: librechat-data-volume
    emptyDir: {}
  - name: librechat-logs-volume
    emptyDir: {}
  - name: librechat-api-logs-volume
    emptyDir: {}

# --- Subcharts ---

mongodb:
  enabled: true
  image:
    pullPolicy: IfNotPresent
    registry: docker.io
    repository: mongo
    tag: '8.0.20'
  auth:
    enabled: false
  databases:
    - LibreChat
  podSecurityContext: {}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
  extraVolumeMounts:
    - name: datadir
      mountPath: /data/db
  persistence:
    enabled: true
    storageClass: gp3-csi
    size: 2Gi

meilisearch:
  enabled: true
  auth:
    existingMasterKeySecret: librechat-librechat-secretenv
  image:
    tag: v1.7.3
  persistence:
    enabled: true
    storageClass: gp3-csi
    size: 2Gi
  serviceAccount:
    create: true
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
  sccRoleDisabled: true

postgresql:
  enabled: true
  auth:
    database: librechat-vectordb
    username: postgres
    password: postgres
  image:
    registry: ghcr.io
    repository: bat-bs/bitnami-pgvector
    tag: pg16
  primary:
    podSecurityContext:
      enabled: false
    containerSecurityContext:
      enabled: false
    persistence:
      enabled: true
      storageClass: gp3-csi
      size: 2Gi
    initdb:
      scripts:
        create-librechat-db.sql: |
          CREATE DATABASE "librechat-vectordb" WITH OWNER postgres;
          \c librechat-vectordb
          CREATE EXTENSION IF NOT EXISTS vector;

librechat-rag-api:
  enabled: true
  embeddingsProvider: openai
  persistence:
    enabled: false
  rag:
    configEnv:
      DB_PORT: '5432'
      EMBEDDINGS_PROVIDER: openai
      RAG_UPLOAD_DIR: /uploads
  volumeMounts:
    - name: librechat-uploads
      mountPath: /uploads/
  volumes:
    - name: librechat-uploads
      emptyDir: {}
  enableServiceLinks: false
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
  sccRoleDisabled: true

# Ollama — disabled by default to save resources.
# Enable and uncomment the Ollama endpoint above.
ollama:
  enabled: false

# RamaLama (Red Hat) — optional local CPU Granite via llama-server.
# Enable and uncomment the RamaLama endpoint above.
ramalama:
  enabled: false
  sccRoleDisabled: true
  persistence:
    enabled: false
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true

# LiteLLM proxy — routes LibreChat requests to sandbox shared vLLM models.
# Uses the pod's ServiceAccount token for authentication (auto-refresh).
litellm:
  enabled: true
  route:
    enabled: true
    host: ''
  image:
    repository: litellm/litellm-non_root
    tag: v1.82.3-stable
    pullPolicy: IfNotPresent
  service:
    port: 4000
  masterKey: "sk-litellm-1234"
  apiKey: "dummy"
  databaseUrl: ""
  useServiceAccountToken: true
  models:
    - name: granite-3.1-8b
      modelId: isvc-granite-31-8b-fp8
      apiBase: "https://isvc-granite-31-8b-fp8-predictor.sandbox-shared-models.svc.cluster.local:8443/v1"
    - name: qwen3-8b
      modelId: isvc-qwen3-8b-fp8
      apiBase: "https://isvc-qwen3-8b-fp8-predictor.sandbox-shared-models.svc.cluster.local:8443/v1"
    - name: nemotron-nano-9b
      modelId: isvc-nemotron-nano-9b-v2-fp8
      apiBase: "https://isvc-nemotron-nano-9b-v2-fp8-predictor.sandbox-shared-models.svc.cluster.local:8443/v1"
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# --- Misc ---

lifecycle: {}
nameOverride: ''
nodeSelector: {}
podAnnotations: {}
podLabels: {}
replicaCount: 1
tolerations: []
updateStrategy:
  type: RollingUpdate
